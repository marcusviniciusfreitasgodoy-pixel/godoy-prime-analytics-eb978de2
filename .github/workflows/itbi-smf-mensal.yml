name: ITBI SMF mensal

# Carga agendada do ITBI por escritura (planilhas da SMF).
#
# Toda segunda-feira às 8h (Brasília) o job lê a página da SMF e compara o nome
# da planilha recente com o último arquivo carregado na base. Se a SMF publicou
# planilha nova, carrega o ano da última escritura em diante, com as mesmas
# etapas do painel /admin, e consolida um trimestre por chamada. Se não
# publicou, termina em segundos sem gravar nada. Ver scripts/itbi-smf/README.md.
#
# Requer o secret ITBI_CARGA_SECRET, com o MESMO valor do secret de mesmo nome
# na Lovable Cloud: a função ingest-itbi-smf confere o cabeçalho x-cron-secret.
# O job nunca usa a chave de serviço do banco.
#
# O GitHub desativa agendamentos de repositórios sem commits por 60 dias; se
# isso acontecer, reativar em Actions > ITBI SMF mensal > Enable workflow.

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar = carrega só se houver planilha nova; forcar = carrega mesmo sem novidade; simular = lê e prepara, não grava"
        type: choice
        options: [verificar, forcar, simular]
        default: verificar
      desde:
        description: "Ano inicial (vazio = ano da última escritura da base)"
        required: false
        default: ""

concurrency:
  group: itbi-smf
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  carregar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Verificar e carregar
        env:
          ITBI_CARGA_SECRET: ${{ secrets.ITBI_CARGA_SECRET }}
          MODO: ${{ github.event.inputs.modo || 'verificar' }}
          DESDE: ${{ github.event.inputs.desde }}
        run: |
          args=()
          if [ "$MODO" = "forcar" ]; then args+=(--forcar); fi
          if [ "$MODO" = "simular" ]; then args+=(--simular); fi
          if [ -n "$DESDE" ]; then args+=(--desde="$DESDE"); fi
          bun scripts/itbi-smf/carga-mensal.ts "${args[@]}"
